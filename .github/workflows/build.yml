name: Build amdxdna sysext

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      single_version:
        description: "Build only this TrueNAS tag (e.g. TS-26.0.0-BETA.1). Leave blank for all."
        required: false
        default: ""

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: prepare-matrix
  # Reads kernels.json and emits a matrix of {truenas_tag, base_version,
  # dkms_ref}. Mode (production/debug) is added as a separate matrix axis
  # in each downstream job, so every kernel gets both builds automatically.
  # ---------------------------------------------------------------------------
  prepare-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Build matrix from kernels.json
        id: set
        env:
          SINGLE_VERSION: ${{ inputs.single_version }}
        run: |
          expanded=$(jq -c '[.[] | {base_version, truenas_tag, dkms_ref: (.dkms_ref // "main")}]' kernels.json)
          if [[ -n "${SINGLE_VERSION}" ]]; then
            expanded=$(echo "${expanded}" | jq -c --arg v "${SINGLE_VERSION}" '[.[] | select(.truenas_tag == $v)]')
            [[ "$(echo "${expanded}" | jq 'length')" -gt 0 ]] \
              || { echo "ERROR: '${SINGLE_VERSION}' not found in kernels.json" >&2; exit 1; }
          fi
          echo "matrix=${expanded}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: build-firmware
  # Fetches linux-firmware from Ubuntu 24.04 (noble), which carries amdnpu
  # firmware absent from jammy. Runs once, shared by all kernel/mode variants.
  # ---------------------------------------------------------------------------
  build-firmware:
    runs-on: ubuntu-26.04
    steps:
      - name: Fetch amdnpu firmware from linux-firmware
        run: |
          mkdir -p fw-deb fw-extract amdnpu-firmware
          cd fw-deb && apt-get download linux-firmware
          dpkg-deb -x linux-firmware_*.deb ../fw-extract
          fw_path="$(find ../fw-extract -type d -name amdnpu | head -n1)"
          [[ -n "${fw_path}" ]] || { echo "ERROR: amdnpu not found in linux-firmware" >&2; exit 1; }
          rsync -a "${fw_path}/" ../amdnpu-firmware/
          dpkg-deb -f linux-firmware_*.deb Version > ../amdnpu-firmware/.pkg-version
          echo "linux-firmware version: $(cat ../amdnpu-firmware/.pkg-version)"

      - uses: actions/upload-artifact@v7
        with:
          name: amdxdna-firmware-files
          path: amdnpu-firmware/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3: prepare-headers
  # Clones truenas/linux, applies the exact three-overlay config sequence, runs
  # make syncconfig + modules_prepare, saves to cache. Requires Rust 1.91.1 +
  # pahole so CONFIG_RUST=y and CONFIG_DEBUG_INFO_BTF=y survive syncconfig,
  # matching the production kernel's struct layouts exactly.
  # Matrix: kernels × {production, debug}
  # ---------------------------------------------------------------------------
  prepare-headers:
    needs: prepare-matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
        mode: [production, debug]

    name: "headers / ${{ matrix.kernel.truenas_tag }} / ${{ matrix.mode }}"

    steps:
      - name: Install kernel-prep dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential dwarves flex gawk git \
            libcap-dev libelf-dev liblzma-dev libssl-dev \
            make python3-dev

      - name: Install Rust 1.91.1 + bindgen 0.72.1
        run: |
          rustup toolchain install 1.91.1-x86_64-unknown-linux-gnu --profile minimal
          rustup default 1.91.1-x86_64-unknown-linux-gnu
          rustup component add rust-src rustfmt
          cargo install --locked bindgen-cli --version 0.72.1

      - name: Cache prepared kernel headers
        id: cache-kernel
        uses: actions/cache@v5
        with:
          path: kernel-src
          key: truenas-kernel-headers-${{ matrix.kernel.truenas_tag }}-${{ matrix.mode }}-v11

      - name: Clone and prepare kernel source
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        env:
          KERNEL_SOURCE_REF: ${{ matrix.kernel.truenas_tag }}
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          git -c init.defaultBranch=main clone --depth 1 --branch "${KERNEL_SOURCE_REF}" \
            https://github.com/truenas/linux kernel-src
          rm -rf kernel-src/.git kernel-src/.gitattributes kernel-src/.gitignore
          cd kernel-src
          make ARCH=x86_64 defconfig
          ./scripts/kconfig/merge_config.sh .config scripts/package/truenas/debian_amd64.config
          ./scripts/kconfig/merge_config.sh .config scripts/package/truenas/truenas.config
          if [[ "${BUILD_MODE}" == "debug" ]]; then
            ./scripts/kconfig/merge_config.sh .config \
              scripts/package/truenas/tn-debug.config 2>/dev/null || \
            ./scripts/kconfig/merge_config.sh .config \
              scripts/package/truenas/tn-production.config
          else
            ./scripts/kconfig/merge_config.sh .config scripts/package/truenas/tn-production.config
          fi
          ./scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          make syncconfig
          make -j$(nproc) scripts prepare modules_prepare

  # ---------------------------------------------------------------------------
  # Job 4: build
  # Restores kernel headers from cache, clones xdna-driver, generates
  # config_kernel.h, compiles amdxdna.ko. Uploads the .ko as an artifact
  # for the downstream package job. No firmware dependency here.
  # Matrix: kernels × {production, debug}
  # ---------------------------------------------------------------------------
  build:
    needs: [prepare-matrix, prepare-headers]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
        mode: [production, debug]

    name: "build / ${{ matrix.kernel.truenas_tag }} / ${{ matrix.mode }}"

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc build-essential flex git kmod \
            libelf-dev libssl-dev make

      - name: Restore kernel headers from cache
        uses: actions/cache/restore@v5
        with:
          path: kernel-src
          key: truenas-kernel-headers-${{ matrix.kernel.truenas_tag }}-${{ matrix.mode }}-v11
          fail-on-cache-miss: true

      - name: Clone xdna-driver
        env:
          DKMS_REF: ${{ matrix.kernel.dkms_ref }}
        run: |
          git clone --depth 1 --branch "${DKMS_REF}" \
            https://github.com/amd/xdna-driver src/amdxdna-dkms || \
          git clone --depth 1 https://github.com/amd/xdna-driver src/amdxdna-dkms

      - name: Generate config_kernel.h
        env:
          KERNEL_VERSION: ${{ matrix.kernel.base_version }}-${{ matrix.mode }}+truenas
        run: |
          drv_src="src/amdxdna-dkms/drivers/accel/amdxdna"
          KERNEL_SRC="${GITHUB_WORKSPACE}/kernel-src" \
            KERNEL_VER="${KERNEL_VERSION}" \
            KBUILD_MODPOST_WARN=1 \
            KCFLAGS="-Wno-unused-variable" \
            OUT="${drv_src}/config_kernel.h" \
            bash "src/amdxdna-dkms/drivers/accel/tools/configure_kernel.sh"

      - name: Build amdxdna.ko
        env:
          KERNEL_VERSION: ${{ matrix.kernel.base_version }}-${{ matrix.mode }}+truenas
        run: |
          drv_src="src/amdxdna-dkms/drivers/accel/amdxdna"
          KBUILD_MODPOST_WARN=1 make -C "${GITHUB_WORKSPACE}/kernel-src" \
            M="${GITHUB_WORKSPACE}/${drv_src}" \
            CFLAGS_MODULE="-DAMDXDNA_DEVEL" \
            OFT_CONFIG_AMDXDNA_PCI=y \
            modules
          [[ -f "${drv_src}/amdxdna.ko" ]] || { echo "ERROR: amdxdna.ko not found" >&2; exit 1; }

      - name: Upload kernel module artifact
        uses: actions/upload-artifact@v7
        with:
          name: amdxdna-ko-${{ matrix.kernel.truenas_tag }}-${{ matrix.mode }}
          path: src/amdxdna-dkms/drivers/accel/amdxdna/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 5: package
  # Single job (no matrix) — downloads ALL ko artifacts and the firmware
  # artifact, then loops over every kernel×mode combination to assemble sysext
  # images and .run self-extractors. Re-run this job alone after installer or
  # packaging changes without recompiling anything.
  # ---------------------------------------------------------------------------
  package:
    needs: [prepare-matrix, build, build-firmware]
    runs-on: ubuntu-26.04
    name: "package"

    steps:
      - uses: actions/checkout@v6

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync squashfs-tools tar

      - uses: actions/download-artifact@v8
        with:
          name: amdxdna-firmware-files
          path: amdnpu-firmware

      # Downloads all amdxdna-ko-* artifacts, each into its own subdirectory
      # named after the artifact (e.g. amdxdna-ko-TS-26.0.0-BETA.1-production/)
      - uses: actions/download-artifact@v8
        with:
          pattern: amdxdna-ko-*
          merge-multiple: false

      - name: Assemble all sysext images and .run installer
        env:
          MATRIX: ${{ needs.prepare-matrix.outputs.matrix }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p out work
          firmware_name="amdxdna-firmware"
          fw_ver="$(cat amdnpu-firmware/.pkg-version 2>/dev/null || echo unknown)"

          # Firmware sysext — built once, shared by all kernel variants
          fw_tree="work/sysext-firmware"
          mkdir -p "${fw_tree}/usr/lib/firmware/amdnpu" \
                   "${fw_tree}/usr/lib/extension-release.d"
          rsync -a amdnpu-firmware/ "${fw_tree}/usr/lib/firmware/amdnpu/"
          printf 'ID=_any\nSYSEXT_SCOPE=system\nARCHITECTURE=x86-64\n' \
            > "${fw_tree}/usr/lib/extension-release.d/extension-release.${firmware_name}"
          mksquashfs "${fw_tree}" "work/${firmware_name}.raw" -comp xz -noappend -quiet

          # Build a module sysext raw for every kernel×mode and collect metadata
          bundle_dir="work/bundle"
          mkdir -p "${bundle_dir}"
          cp "work/${firmware_name}.raw" "${bundle_dir}/"

          echo "${MATRIX}" | jq -r '.[] | [.truenas_tag, .base_version, .dkms_ref] | @tsv' | \
          while IFS=$'\t' read -r truenas_tag base_version dkms_ref; do
            for mode in production debug; do
              kver="${base_version}-${mode}+truenas"
              base_krel="${kver%%+*}"
              module_name="amdxdna-${base_krel}"
              ko_dir="amdxdna-ko-${truenas_tag}-${mode}"

              [[ -f "${ko_dir}/amdxdna.ko" ]] \
                || { echo "ERROR: ${ko_dir}/amdxdna.ko not found" >&2; exit 1; }

              mod_tree="work/sysext-module-${base_krel}"
              mkdir -p \
                "${mod_tree}/usr/lib/modules/${kver}/kernel/drivers/accel/amdxdna" \
                "${mod_tree}/usr/lib/extension-release.d"
              install -m 0644 "${ko_dir}/amdxdna.ko" \
                "${mod_tree}/usr/lib/modules/${kver}/kernel/drivers/accel/amdxdna/amdxdna.ko"
              printf 'ID=_any\nSYSEXT_SCOPE=system\nARCHITECTURE=x86-64\n' \
                > "${mod_tree}/usr/lib/extension-release.d/extension-release.${module_name}"
              mksquashfs "${mod_tree}" "${bundle_dir}/${module_name}.raw" -comp xz -noappend -quiet

              pkg_ver="$(grep -m1 'XDNA_DRIVER_VERSION' "${ko_dir}/Makefile" \
                | grep -oP '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || echo '0.0.0')"

              {
                printf 'KERNEL_VERSION=%s\n'        "${kver}"
                printf 'DKMS_REF=%s\n'              "${dkms_ref}"
                printf 'DKMS_VERSION=%s\n'          "${pkg_ver}"
                printf 'FIRMWARE_PKG_VERSION=%s\n'  "${fw_ver}"
                printf 'BUILD_RUN_ID=%s\n'          "${BUILD_RUN_ID}"
                printf 'BUILD_SHA=%s\n'             "${BUILD_SHA}"
                printf 'BUILD_TIME_UTC=%s\n'        "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              } >> "${bundle_dir}/metadata.env"
            done
          done

          tar -C "${bundle_dir}" -czf work/bundle.tar.gz .

          installer="builder/installer-template.sh"
          run_file="out/amdxdna-override.run"
          payload_line="$(($(wc -l < "${installer}") + 1))"
          sed -e "s|__PAYLOAD_LINE__|${payload_line}|g" "${installer}" > "${run_file}"
          cat work/bundle.tar.gz >> "${run_file}"
          chmod +x "${run_file}"

      - uses: actions/upload-artifact@v7
        with:
          name: amdxdna-sysext
          path: out/*.run
          retention-days: 30
