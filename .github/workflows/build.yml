name: Build amdxdna sysext

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      single_version:
        description: "Build only this TrueNAS tag (e.g. TS-26.0.0-BETA.1). Leave blank for all."
        required: false
        default: ""

jobs:
  prepare-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Build matrix from kernels.json
        id: set
        env:
          SINGLE_VERSION: ${{ inputs.single_version }}
        run: |
          # Expand each kernel entry into one job per mode, computing the full kernel release string.
          expanded=$(jq -c '[
            .[] | . as $e |
            (if $e.modes then $e.modes else ["production"] end)[] | . as $mode |
            {
              base_version: $e.base_version,
              truenas_tag:  $e.truenas_tag,
              mode:         $mode,
              kernel_version: ($e.base_version + "-" + $mode + "+truenas"),
              dkms_ref:     ($e.dkms_ref // "main")
            }
          ]' kernels.json)
          if [[ -n "${SINGLE_VERSION}" ]]; then
            matrix=$(echo "${expanded}" | jq -c --arg v "${SINGLE_VERSION}" '[.[] | select(.truenas_tag == $v)]')
            [[ "$(echo "${matrix}" | jq 'length')" -gt 0 ]] \
              || { echo "ERROR: '${SINGLE_VERSION}' not found in kernels.json" >&2; exit 1; }
          else
            matrix="${expanded}"
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: prepare-headers
  # Clones the TrueNAS kernel source, applies the exact three-overlay config
  # sequence, runs make syncconfig + modules_prepare, and saves the result to
  # the Actions cache.  Requires Rust + pahole so that CONFIG_RUST=y and
  # CONFIG_DEBUG_INFO_BTF=y survive syncconfig (matching the production kernel).
  # This job is the slow step (~15 min cold); once cached it exits quickly.
  # Re-running the downstream build job re-uses the cache without re-running
  # this job.
  # ---------------------------------------------------------------------------
  prepare-headers:
    needs: prepare-matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    name: "headers / ${{ matrix.truenas_tag }} / ${{ matrix.mode }}"

    steps:
      - uses: actions/checkout@v6

      - name: Install kernel-prep dependencies
        run: |
          sudo apt-get update
          # dwarves (pahole) is required for CONFIG_DEBUG_INFO_BTF=y.
          # Without it syncconfig disables BTF, changing struct module layout.
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential dwarves flex gawk git \
            libcap-dev libelf-dev liblzma-dev libssl-dev \
            make python3-dev

      - name: Install Rust toolchain
        run: |
          # The production TrueNAS kernel was built with CONFIG_RUST=y.
          # debian_amd64.config embeds RUSTC_VERSION=109101 (rustc 1.91.1)
          # and bindgen 0.72.1. make syncconfig validates installed versions
          # against these values; mismatches silently set CONFIG_RUST=n,
          # changing struct layouts → 'existing value is nonzero' at modprobe.
          rustup toolchain install 1.91.1-x86_64-unknown-linux-gnu --profile minimal
          rustup default 1.91.1-x86_64-unknown-linux-gnu
          rustup component add rust-src rustfmt
          cargo install --locked bindgen-cli --version 0.72.1

      - name: Cache prepared kernel headers
        id: cache-kernel
        uses: actions/cache@v5
        with:
          path: kernel-src
          key: truenas-kernel-headers-${{ matrix.truenas_tag }}-${{ matrix.mode }}-v10

      - name: Fetch and prepare kernel headers
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        env:
          KERNEL_SOURCE_REF: ${{ matrix.truenas_tag }}
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          git -c init.defaultBranch=main clone --depth 1 --branch "${KERNEL_SOURCE_REF}" \
            https://github.com/truenas/linux kernel-src
          # Remove .git so scripts/setlocalversion cannot detect a dirty tree
          # and append a trailing '+' to KERNELRELEASE.
          rm -rf kernel-src/.git kernel-src/.gitattributes kernel-src/.gitignore
          cd kernel-src
          # Replicate TrueNAS's exact kernel config sequence so that CONFIG-gated
          # kernel data structures (including struct module) match the running kernel
          # exactly.  The three overlay files are the same ones used by TrueNAS CI.
          make ARCH=x86_64 defconfig
          ./scripts/kconfig/merge_config.sh .config \
            scripts/package/truenas/debian_amd64.config
          ./scripts/kconfig/merge_config.sh .config \
            scripts/package/truenas/truenas.config
          if [[ "${BUILD_MODE}" == "debug" ]]; then
            ./scripts/kconfig/merge_config.sh .config \
              scripts/package/truenas/tn-debug.config 2>/dev/null || \
            ./scripts/kconfig/merge_config.sh .config \
              scripts/package/truenas/tn-production.config
          else
            ./scripts/kconfig/merge_config.sh .config \
              scripts/package/truenas/tn-production.config
          fi
          # truenas.config points SYSTEM_TRUSTED_KEYS at debian/certs/ which is not
          # present in a shallow clone.  Clear it; the cert bundle is not needed for
          # modules_prepare and does not affect the compiled struct layout.
          ./scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          make syncconfig
          make -j$(nproc) scripts prepare modules_prepare

  # ---------------------------------------------------------------------------
  # Job 3: build
  # Restores the prepared kernel headers from cache, builds amdxdna.ko and
  # packages it into sysext images.  No Rust required here — the module itself
  # is pure C; Rust was only needed in prepare-headers for modules_prepare.
  # This is the job to re-run when the module compilation or packaging fails.
  # ---------------------------------------------------------------------------
  build:
    needs: [prepare-matrix, prepare-headers]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    name: "build / ${{ matrix.truenas_tag }} / ${{ matrix.mode }}"

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex git kmod \
            libelf-dev libssl-dev make rsync \
            squashfs-tools tar xz-utils

      - name: Restore prepared kernel headers
        uses: actions/cache/restore@v5
        with:
          path: kernel-src
          key: truenas-kernel-headers-${{ matrix.truenas_tag }}-${{ matrix.mode }}-v10
          fail-on-cache-miss: true

      - name: Build sysext bundle
        env:
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          KERNEL_HEADERS_DIR: ${{ github.workspace }}/kernel-src
          AMDXDNA_REF: ${{ matrix.dkms_ref }}
          WORK_ROOT: ${{ github.workspace }}/work
          OUT_DIR: ${{ github.workspace }}/out
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_SHA: ${{ github.sha }}
          INSTALLER_TEMPLATE: ${{ github.workspace }}/builder/installer-template.sh
        run: |
          mkdir -p "${WORK_ROOT}" "${OUT_DIR}"
          chmod +x builder/build.sh
          builder/build.sh

      - name: Upload sysext artifacts
        uses: actions/upload-artifact@v7
        with:
          name: amdxdna-sysext-${{ matrix.truenas_tag }}-${{ matrix.mode }}
          path: out/
          retention-days: 30
