name: Build amdxdna sysext

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily — nightly builds
  workflow_dispatch:
    inputs:
      single_version:
        description: "Build only this TrueNAS tag/branch (e.g. TS-26.0.0-BETA.1). Leave blank for all."
        required: false
        default: ""
      include_nightly:
        description: "Include nightly (branch-based) entries from kernels.json"
        type: boolean
        required: false
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: prepare-matrix
  # Reads kernels.json and emits a matrix of {truenas_tag, base_version,
  # xdna_ref, kernel_sha, slug}. kernel_sha is resolved via ls-remote so
  # nightly branch caches advance with the branch HEAD.
  # ---------------------------------------------------------------------------
  prepare-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build matrix from kernels.json
        id: set
        env:
          SINGLE_VERSION:   ${{ inputs.single_version }}
          EVENT_NAME:       ${{ github.event_name }}
          INCLUDE_NIGHTLY:  ${{ inputs.include_nightly }}
        run: bash builder/prepare_matrix.sh

  # ---------------------------------------------------------------------------
  # Job 2: build-firmware
  # Fetches amdnpu firmware from linux-firmware git.
  # Builds amdxdna-firmware.raw (squashfs sysext image).
  # Cache key: linux-firmware HEAD SHA — reused across runs until upstream changes.
  # ---------------------------------------------------------------------------
  build-firmware:
    runs-on: ubuntu-24.04
    outputs:
      fw_commit:   ${{ steps.head.outputs.fw_commit }}
      fw_commit_short: ${{ steps.head.outputs.fw_commit_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Get linux-firmware HEAD commit
        id: head
        run: |
          fw_commit="$(git ls-remote \
            https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git \
            HEAD | cut -f1)"
          echo "linux-firmware HEAD: ${fw_commit}"
          echo "fw_commit=${fw_commit}"                   >> "$GITHUB_OUTPUT"
          echo "fw_commit_short=${fw_commit:0:12}"        >> "$GITHUB_OUTPUT"

      - name: Restore firmware sysext from cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: amdxdna-firmware-${{ steps.head.outputs.fw_commit_short }}.raw
          key: amdxdna-firmware-raw-${{ steps.head.outputs.fw_commit }}

      - name: Install packaging tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends squashfs-tools rsync

      - name: Fetch amdnpu firmware
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash builder/1_fetch_firmware.sh

      - name: Build firmware sysext image (.raw)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash builder/build_firmware_sysext.sh "${{ steps.head.outputs.fw_commit_short }}"

      - name: Save firmware sysext to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: amdxdna-firmware-${{ steps.head.outputs.fw_commit_short }}.raw
          key: amdxdna-firmware-raw-${{ steps.head.outputs.fw_commit }}

  # ---------------------------------------------------------------------------
  # Job 3: build-rocm-tools
  # Fetches ROCm/XRT packages, builds rocm-tools.raw sysext image.
  # Cache key: rocm-version + xrt package version string (stable across runs).
  # ---------------------------------------------------------------------------
  build-rocm-tools:
    runs-on: ubuntu-24.04
    outputs:
      rocm_version: ${{ steps.ver.outputs.rocm_version }}
      xrt_version:  ${{ steps.ver.outputs.xrt_version }}
      cache_key:    ${{ steps.ver.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve ROCm version
        id: resolve
        run: echo "rocm_version=7.2" >> "$GITHUB_OUTPUT"

      # Probe the XRT package version without installing — used to form the cache key.
      - name: Probe XRT package version
        id: probe
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y --no-install-recommends wget gnupg ca-certificates >/dev/null
          sudo mkdir -p /etc/apt/keyrings
          wget -qO - "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF83FE7BE8F1A44E83CDA3625D47169167A18444E" \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/xrt.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/xrt.gpg] https://ppa.launchpadcontent.net/amd-team/xrt/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/xrt.list
          sudo apt-get update -qq >/dev/null
          xrt_ver=$(apt-cache show libxrt-utils 2>/dev/null | awk '/^Version:/{print $2; exit}' || echo "unknown")
          echo "xrt_version=${xrt_ver}" >> "$GITHUB_OUTPUT"

      - name: Compute cache key
        id: ver
        run: |
          rocm_version="${{ steps.resolve.outputs.rocm_version }}"
          xrt_version="${{ steps.probe.outputs.xrt_version }}"
          cache_key="rocm-tools-raw-rocm${rocm_version}-xrt${xrt_version}"
          echo "rocm_version=${rocm_version}" >> "$GITHUB_OUTPUT"
          echo "xrt_version=${xrt_version}"   >> "$GITHUB_OUTPUT"
          echo "cache_key=${cache_key}"        >> "$GITHUB_OUTPUT"

      - name: Restore rocm-tools sysext from cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: rocm-tools/out/rocm-tools-*.raw
          key: ${{ steps.ver.outputs.cache_key }}

      - name: Install packaging tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y --no-install-recommends squashfs-tools rsync

      - name: Fetch and stage ROCm/XRT packages
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ROCM_VERSION: ${{ steps.resolve.outputs.rocm_version }}
        working-directory: rocm-tools
        run: bash builder/1_fetch_packages.sh

      - name: Build rocm-tools sysext image (.raw)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: rocm-tools
        run: bash builder/2_package.sh

      - name: Save rocm-tools sysext to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: rocm-tools/out/rocm-tools-*.raw
          key: ${{ steps.ver.outputs.cache_key }}

  # ---------------------------------------------------------------------------
  # Job 4: prepare-headers
  # Clones truenas/linux, applies TrueNAS kernel config overlays, runs
  # syncconfig + modules_prepare. Requires Rust 1.91.1 + pahole.
  # Cache key: kernel_sha + mode — stable for tagged releases.
  # ---------------------------------------------------------------------------
  prepare-headers:
    needs: prepare-matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
        mode: [production, debug]
    name: "headers / ${{ matrix.kernel.truenas_tag }} / ${{ matrix.mode }}"
    steps:
      - uses: actions/checkout@v4

      - name: Restore kernel headers from cache
        id: cache-kernel
        uses: actions/cache/restore@v4
        with:
          path: kernel-src
          key: truenas-kernel-headers-${{ matrix.kernel.kernel_sha }}-${{ matrix.mode }}-v11

      - name: Install kernel-prep dependencies
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential dwarves flex gawk git \
            libcap-dev libelf-dev liblzma-dev libssl-dev \
            make python3-dev

      - name: Install Rust 1.91.1 + bindgen 0.72.1
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.91.1-x86_64-unknown-linux-gnu --profile minimal
          rustup default 1.91.1-x86_64-unknown-linux-gnu
          rustup component add rust-src rustfmt
          cargo install --locked bindgen-cli --version 0.72.1

      - name: Clone and prepare kernel source
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        env:
          KERNEL_SOURCE_REF: ${{ matrix.kernel.truenas_tag }}
          BUILD_MODE:        ${{ matrix.mode }}
        run: bash builder/2_prepare_headers.sh

      - name: Save kernel headers to cache
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kernel-src
          key: truenas-kernel-headers-${{ matrix.kernel.kernel_sha }}-${{ matrix.mode }}-v11

  # ---------------------------------------------------------------------------
  # Job 5: build
  # Restores kernel headers, clones xdna-driver, builds amdxdna.ko, then
  # assembles a per-kernel module sysext image (amdxdna-<base_krel>.raw).
  # Cache key: run_id + slug + mode (one-run-only pass-through to package job).
  # ---------------------------------------------------------------------------
  build:
    needs: [prepare-matrix, prepare-headers]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
        mode: [production, debug]
    name: "build / ${{ matrix.kernel.truenas_tag }} / ${{ matrix.mode }}"
    outputs:
      xdna_version: ${{ steps.build_ko.outputs.xdna_version }}
      xrt_version:  ${{ steps.xrt_ver.outputs.xrt_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build + packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc build-essential flex git kmod \
            libelf-dev libssl-dev make squashfs-tools

      - name: Restore kernel headers from cache
        uses: actions/cache/restore@v4
        with:
          path: kernel-src
          key: truenas-kernel-headers-${{ matrix.kernel.kernel_sha }}-${{ matrix.mode }}-v11
          fail-on-cache-miss: true

      - name: Clone xdna-driver
        env:
          XDNA_REF: ${{ matrix.kernel.xdna_ref }}
        run: |
          git clone --depth 1 --branch "${XDNA_REF}" \
            https://github.com/amd/xdna-driver src/amdxdna-dkms || \
          git clone --depth 1 https://github.com/amd/xdna-driver src/amdxdna-dkms

      - name: Extract XRT version from submodule
        id: xrt_ver
        run: bash builder/get_xrt_version.sh src/amdxdna-dkms

      - name: Generate config_kernel.h
        env:
          KERNEL_VERSION: ${{ matrix.kernel.base_version }}-${{ matrix.mode }}+truenas
        run: |
          drv_src="src/amdxdna-dkms/drivers/accel/amdxdna"
          KERNEL_SRC="${GITHUB_WORKSPACE}/kernel-src" \
            KERNEL_VER="${KERNEL_VERSION}" \
            KBUILD_MODPOST_WARN=1 \
            KCFLAGS="-Wno-unused-variable" \
            OUT="${drv_src}/config_kernel.h" \
            bash "src/amdxdna-dkms/drivers/accel/tools/configure_kernel.sh"

      - name: Build amdxdna.ko
        id: build_ko
        env:
          KERNEL_VERSION: ${{ matrix.kernel.base_version }}-${{ matrix.mode }}+truenas
          KERNEL_SRC:     ${{ github.workspace }}/kernel-src
          DRIVER_SRC:     ${{ github.workspace }}/src/amdxdna-dkms/drivers/accel/amdxdna
        run: bash builder/build_ko.sh

      - name: Build module sysext image (.raw)
        env:
          KERNEL_VERSION: ${{ matrix.kernel.base_version }}-${{ matrix.mode }}+truenas
        run: |
          bash builder/build_module_sysext.sh \
            src/amdxdna-dkms/drivers/accel/amdxdna/amdxdna.ko

      - name: Cache module sysext image
        uses: actions/cache/save@v4
        with:
          path: |
            amdxdna-*.raw
            module_version.txt
            xrt_version.txt
          key: amdxdna-raw-${{ github.run_id }}-${{ matrix.kernel.slug }}-${{ matrix.mode }}

  # ---------------------------------------------------------------------------
  # Job 6: package
  # Restores all sysext .raw images from cache, then assembles one .run
  # per deliverable:
  #   - amdxdna-override-<xdna_ver>.run  (module .raw × all kernels, + firmware .raw)
  #   - rocm-tools-<rocm_ver>.run
  # Each .run is uploaded as its own individual GHA artifact (no archive).
  # ---------------------------------------------------------------------------
  package:
    needs: [prepare-matrix, build, build-firmware, build-rocm-tools]
    runs-on: ubuntu-24.04
    name: "package"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools tar

      # ── Restore firmware .raw ──────────────────────────────────────────────
      - name: Restore firmware sysext from cache
        uses: actions/cache/restore@v4
        with:
          path: amdxdna-firmware-${{ needs.build-firmware.outputs.fw_commit_short }}.raw
          key: amdxdna-firmware-raw-${{ needs.build-firmware.outputs.fw_commit }}
          fail-on-cache-miss: true

      # ── Restore rocm-tools .raw ────────────────────────────────────────────
      - name: Restore rocm-tools sysext from cache
        uses: actions/cache/restore@v4
        with:
          path: rocm-tools/out/rocm-tools-*.raw
          key: ${{ needs.build-rocm-tools.outputs.cache_key }}
          fail-on-cache-miss: true

      # ── Restore per-kernel module .raw from cache (one step per matrix entry × mode) ──
      - uses: actions/cache/restore@v4
        with:
          path: |
            amdxdna-*.raw
            module_version.txt
            xrt_version.txt
          key: amdxdna-raw-${{ github.run_id }}-TS-26.0.0-BETA.1-production
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          path: |
            amdxdna-*.raw
            module_version.txt
            xrt_version.txt
          key: amdxdna-raw-${{ github.run_id }}-TS-26.0.0-BETA.1-debug
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          path: |
            amdxdna-*.raw
            module_version.txt
            xrt_version.txt
          key: amdxdna-raw-${{ github.run_id }}-truenas-linux-6.18-production
          fail-on-cache-miss: false

      - uses: actions/cache/restore@v4
        with:
          path: |
            amdxdna-*.raw
            module_version.txt
            xrt_version.txt
          key: amdxdna-raw-${{ github.run_id }}-truenas-linux-6.18-debug
          fail-on-cache-miss: false

      # ── Assemble amdxdna-override .run ────────────────────────────────────
      - name: Assemble amdxdna-override .run installer
        env:
          BUILD_RUN_ID:     ${{ github.run_id }}
          BUILD_SHA:        ${{ github.sha }}
          AMDXDNA_VERSION:  ${{ needs.build.outputs.xdna_version }}
        run: bash builder/assemble_amdxdna_run.sh

      # ── Assemble rocm-tools .run ──────────────────────────────────────────
      - name: Assemble rocm-tools .run installer
        env:
          ROCM_VERSION:  ${{ needs.build-rocm-tools.outputs.rocm_version }}
          XRT_VERSION:   ${{ needs.build-rocm-tools.outputs.xrt_version }}
          BUILD_RUN_ID:  ${{ github.run_id }}
          BUILD_SHA:     ${{ github.sha }}
        working-directory: rocm-tools
        run: bash builder/assemble_run.sh

      # ── Read final versions for release body ──────────────────────────────
      - name: Read xdna version
        id: ver
        run: echo "xdna_ver=$(cat out/version.txt)" >> "$GITHUB_OUTPUT"

      # ── Upload each .run as its own individual artifact ───────────────────
      - name: Upload amdxdna-override .run
        uses: actions/upload-artifact@v4
        with:
          name: amdxdna-override-${{ steps.ver.outputs.xdna_ver }}
          path: out/amdxdna-override-${{ steps.ver.outputs.xdna_ver }}.run
          compression-level: 0
          retention-days: 30

      - name: Upload rocm-tools .run
        uses: actions/upload-artifact@v4
        with:
          name: rocm-tools-${{ needs.build-rocm-tools.outputs.rocm_version }}
          path: out/rocm-tools-*.run
          compression-level: 0
          retention-days: 30

      # ── GitHub Release (main branch pushes only) ──────────────────────────
      - name: Check if release already exists
        id: check-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if gh release view "v${{ steps.ver.outputs.xdna_ver }}" \
              --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.check-release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.xdna_ver }}
          name: amdxdna ${{ steps.ver.outputs.xdna_ver }}
          body: |
            AMD XDNA kernel module + ROCm/XRT userspace tools sysext for TrueNAS SCALE.

            Built from [amd/xdna-driver](https://github.com/amd/xdna-driver) version ${{ steps.ver.outputs.xdna_ver }}.
            ROCm ${{ needs.build-rocm-tools.outputs.rocm_version }}, XRT ${{ needs.build-rocm-tools.outputs.xrt_version }}.

            ## Install XDNA kernel module
            ```bash
            bash amdxdna-override-${{ steps.ver.outputs.xdna_ver }}.run
            ```
            Auto-detects the running kernel and selects the correct module variant.

            ## Install ROCm/XRT userspace tools
            ```bash
            bash rocm-tools-${{ needs.build-rocm-tools.outputs.rocm_version }}.run
            ```
            Provides `/usr/bin/rocm-smi` and `/usr/bin/xrt-smi` via `systemd-sysext`.
          files: out/*.run
