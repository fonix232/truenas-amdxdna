name: Build amdxdna sysext

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily — nightly builds
  workflow_dispatch:
    inputs:
      single_version:
        description: "Build only this TrueNAS tag/branch (e.g. TS-26.0.0-BETA.1). Leave blank for all."
        required: false
        default: ""
      include_nightly:
        description: "Include nightly (branch-based) entries from kernels.json"
        type: boolean
        required: false
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: prepare-matrix
  # Reads kernels.json and emits a matrix of {truenas_tag, base_version,
  # xdna_ref, kernel_sha}. Mode (production/debug) is added as a separate
  # matrix axis in each downstream job.
  #
  # kernel_sha: resolved HEAD SHA for each truenas_tag.  For immutable tags
  # this is a no-op; for branch refs (nightly builds) it advances with the
  # branch, ensuring the kernel-headers cache never returns stale results.
  #
  # nightly entries (nightly: true in kernels.json) are only included on
  # scheduled runs or when include_nightly is set on workflow_dispatch.
  # ---------------------------------------------------------------------------
  prepare-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Build matrix from kernels.json
        id: set
        env:
          SINGLE_VERSION: ${{ inputs.single_version }}
          EVENT_NAME: ${{ github.event_name }}
          INCLUDE_NIGHTLY: ${{ inputs.include_nightly }}
        run: |
          expanded=$(jq -c '[.[] | {base_version: (.base_version // ""), truenas_tag, slug: (.truenas_tag | gsub("/"; "-")), xdna_ref: (.xdna_ref // "main"), nightly: (.nightly // false)}]' kernels.json)

          # Nightly (branch-based) entries are only built on schedule or when
          # explicitly requested via workflow_dispatch.
          if [[ "${EVENT_NAME}" != "schedule" ]] && [[ "${INCLUDE_NIGHTLY}" != "true" ]]; then
            expanded=$(echo "${expanded}" | jq -c '[.[] | select(.nightly == false)]')
          fi

          if [[ -n "${SINGLE_VERSION}" ]]; then
            expanded=$(echo "${expanded}" | jq -c --arg v "${SINGLE_VERSION}" '[.[] | select(.truenas_tag == $v)]')
            [[ "$(echo "${expanded}" | jq 'length')" -gt 0 ]] \
              || { echo "ERROR: '${SINGLE_VERSION}' not found in kernels.json" >&2; exit 1; }
          fi

          # Resolve each truenas_tag to a git SHA. Lightweight ls-remote — no
          # clone. Tries refs/tags/ first (tagged releases), then refs/heads/
          # (branch refs for nightly builds). Falls back to the ref itself so
          # the job still produces output even if the remote is unreachable.
          resolved="[]"
          while IFS= read -r entry; do
            ref=$(echo "${entry}" | jq -r '.truenas_tag')
            sha=$(git ls-remote https://github.com/truenas/linux \
              "refs/tags/${ref}" "refs/heads/${ref}" 2>/dev/null | head -1 | cut -f1)
            sha="${sha:-${ref}}"
            entry=$(echo "${entry}" | jq -c --arg sha "${sha}" '. + {kernel_sha: $sha}')

            # Auto-detect base_version for nightly entries that omit it.
            # Fetches just the first 10 lines of the kernel Makefile using the
            # resolved SHA — unambiguous even for branch names with slashes.
            if [[ "$(echo "${entry}" | jq -r '.base_version')" == "" ]]; then
              makefile=$(curl -fsSL \
                "https://raw.githubusercontent.com/truenas/linux/${sha}/Makefile" \
                2>/dev/null | head -10)
              ver=$(echo "${makefile}" | awk '/^VERSION[[:space:]]*=/{print $3}')
              pl=$(echo  "${makefile}" | awk '/^PATCHLEVEL[[:space:]]*=/{print $3}')
              sl=$(echo  "${makefile}" | awk '/^SUBLEVEL[[:space:]]*=/{print $3}')
              base_version="${ver}.${pl}.${sl}"
              echo "Auto-detected base_version=${base_version} for ${ref}" >&2
              entry=$(echo "${entry}" | jq -c --arg bv "${base_version}" '.base_version = $bv')
            fi

            resolved=$(echo "${resolved}" | jq -c --argjson e "${entry}" '. + [$e]')
          done < <(echo "${expanded}" | jq -c '.[]')

          echo "matrix=${resolved}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: build-firmware
  # Fetches linux-firmware from Ubuntu 24.04 (noble), which carries amdnpu
  # firmware absent from jammy. Runs once, shared by all kernel/mode variants.
  # ---------------------------------------------------------------------------
  build-firmware:
    runs-on: ubuntu-24.04
    outputs:
      fw_commit: ${{ steps.head.outputs.fw_commit }}
    steps:
      - uses: actions/checkout@v6

      - name: Get linux-firmware HEAD commit
        id: head
        run: |
          fw_commit="$(git ls-remote \
            https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git \
            HEAD | cut -f1)"
          echo "linux-firmware HEAD: ${fw_commit}"
          echo "fw_commit=${fw_commit}" >> "$GITHUB_OUTPUT"

      - name: Restore firmware cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: amdnpu-firmware
          key: amdxdna-firmware-${{ steps.head.outputs.fw_commit }}

      - name: Fetch and assemble amdnpu firmware
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash builder/1_fetch_firmware.sh

      - name: Save firmware cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: amdnpu-firmware
          key: amdxdna-firmware-${{ steps.head.outputs.fw_commit }}

  # ---------------------------------------------------------------------------
  # Job 3: prepare-headers
  # Clones truenas/linux, applies the exact three-overlay config sequence, runs
  # make syncconfig + modules_prepare, saves to cache. Requires Rust 1.91.1 +
  # pahole so CONFIG_RUST=y and CONFIG_DEBUG_INFO_BTF=y survive syncconfig,
  # matching the production kernel's struct layouts exactly.
  # Matrix: kernels × {production, debug}
  # ---------------------------------------------------------------------------
  prepare-headers:
    needs: prepare-matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
        mode: [production, debug]

    name: "headers / ${{ matrix.kernel.truenas_tag }} / ${{ matrix.mode }}"

    steps:
      - uses: actions/checkout@v6

      - name: Install kernel-prep dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential dwarves flex gawk git \
            libcap-dev libelf-dev liblzma-dev libssl-dev \
            make python3-dev

      - name: Install Rust 1.91.1 + bindgen 0.72.1
        run: |
          rustup toolchain install 1.91.1-x86_64-unknown-linux-gnu --profile minimal
          rustup default 1.91.1-x86_64-unknown-linux-gnu
          rustup component add rust-src rustfmt
          cargo install --locked bindgen-cli --version 0.72.1

      - name: Cache prepared kernel headers
        id: cache-kernel
        uses: actions/cache@v5
        with:
          path: kernel-src
          key: truenas-kernel-headers-${{ matrix.kernel.kernel_sha }}-${{ matrix.mode }}-v11

      - name: Clone and prepare kernel source
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        env:
          KERNEL_SOURCE_REF: ${{ matrix.kernel.truenas_tag }}
          BUILD_MODE: ${{ matrix.mode }}
        run: bash builder/2_prepare_headers.sh

  # ---------------------------------------------------------------------------
  # Job 4: build
  # Restores kernel headers from cache, clones xdna-driver, generates
  # config_kernel.h, compiles amdxdna.ko. Saves the .ko to cache (keyed by
  # run_id+slug+mode) for the downstream package job. No firmware dependency here.
  # Matrix: kernels × {production, debug}
  # ---------------------------------------------------------------------------
  build:
    needs: [prepare-matrix, prepare-headers]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
        mode: [production, debug]

    name: "build / ${{ matrix.kernel.truenas_tag }} / ${{ matrix.mode }}"

    outputs:
      # All matrix entries build from the same xdna-driver ref, so any
      # instance's version is representative. GitHub uses the last to complete.
      xdna_version: ${{ steps.build_ko.outputs.xdna_version }}

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc build-essential flex git kmod \
            libelf-dev libssl-dev make

      - name: Restore kernel headers from cache
        uses: actions/cache/restore@v5
        with:
          path: kernel-src
          key: truenas-kernel-headers-${{ matrix.kernel.kernel_sha }}-${{ matrix.mode }}-v11
          fail-on-cache-miss: true

      - name: Clone xdna-driver
        env:
          XDNA_REF: ${{ matrix.kernel.xdna_ref }}
        run: |
          git clone --depth 1 --branch "${XDNA_REF}" \
            https://github.com/amd/xdna-driver src/amdxdna-dkms || \
          git clone --depth 1 https://github.com/amd/xdna-driver src/amdxdna-dkms

      - name: Generate config_kernel.h
        env:
          KERNEL_VERSION: ${{ matrix.kernel.base_version }}-${{ matrix.mode }}+truenas
        run: |
          drv_src="src/amdxdna-dkms/drivers/accel/amdxdna"
          KERNEL_SRC="${GITHUB_WORKSPACE}/kernel-src" \
            KERNEL_VER="${KERNEL_VERSION}" \
            KBUILD_MODPOST_WARN=1 \
            KCFLAGS="-Wno-unused-variable" \
            OUT="${drv_src}/config_kernel.h" \
            bash "src/amdxdna-dkms/drivers/accel/tools/configure_kernel.sh"

      - name: Build amdxdna.ko
        id: build_ko
        env:
          KERNEL_VERSION: ${{ matrix.kernel.base_version }}-${{ matrix.mode }}+truenas
        run: |
          drv_src="src/amdxdna-dkms/drivers/accel/amdxdna"
          drv_c="${drv_src}/amdxdna_pci_drv.c"

          # Remove stale MODULE_VERSION() — FLM reads the driver version via
          # DRM_IOCTL_VERSION (drm_driver.major/minor), not from module metadata.
          # Keeping the hardcoded "0.1" string would shadow the correct 0.10
          # that the drm_driver struct already advertises at runtime.
          sed -i '/^MODULE_VERSION(/d' "${drv_c}"

          # Write module_version.txt from the actual MAJOR.MINOR defines so the
          # package job and release tag reflect what FLM really sees.
          xdna_major=$(grep -m1 'define[[:space:]]\+AMDXDNA_DRIVER_MAJOR' "${drv_c}" | grep -oP '\d+$')
          xdna_minor=$(grep -m1 'define[[:space:]]\+AMDXDNA_DRIVER_MINOR' "${drv_c}" | grep -oP '\d+$')
          xdna_modver="${xdna_major}.${xdna_minor}"
          echo "AMDXDNA_VERSION=${xdna_modver}" >> "$GITHUB_ENV"
          echo "xdna_version=${xdna_modver}" >> "$GITHUB_OUTPUT"
          echo "Driver version: ${xdna_modver}"

          # Fix: amdxdna_sva_fini must be called before mmdrop(client->mm).
          # When FLM terminates dirty (SIGKILL / container stop), mm_users has
          # already reached zero by the time DRM close runs. mmdrop then drops
          # mm_count to zero and frees mm_struct, so the subsequent
          # iommu_sva_unbind_device call traverses freed mm IOMMU SVA list
          # entries, triggering a general protection fault (kernel panic).
          # Swapping the two calls keeps the mm alive across the SVA unbind.
          awk '
            /^static void amdxdna_client_cleanup\(/ { in_fn = 1 }
            in_fn && /^\}/ { in_fn = 0 }
            in_fn && /^[[:space:]]+mmdrop\(client->mm\);/ {
              hold = $0; getline nxt
              if (nxt ~ /^[[:space:]]+amdxdna_sva_fini\(client\);/) {
                print nxt; print hold; next
              }
              print hold
              $0 = nxt
            }
            { print }
          ' "${drv_c}" > "${drv_c}.tmp" && mv "${drv_c}.tmp" "${drv_c}"
          grep -q 'amdxdna_sva_fini(client)' "${drv_c}" \
            || { echo "ERROR: SVA ordering patch was not applied to ${drv_c}" >&2; exit 1; }
          echo "Applied amdxdna_client_cleanup SVA-before-mmdrop fix"

          KBUILD_MODPOST_WARN=1 make -C "${GITHUB_WORKSPACE}/kernel-src" \
            M="${GITHUB_WORKSPACE}/${drv_src}" \
            CFLAGS_MODULE="-DAMDXDNA_DEVEL" \
            OFT_CONFIG_AMDXDNA_PCI=y \
            modules
          [[ -f "${drv_src}/amdxdna.ko" ]] || { echo "ERROR: amdxdna.ko not found" >&2; exit 1; }

          # Stage the .ko and AMDXDNA_VERSION into a flat dir for caching
          mkdir -p ko-staging
          cp "${drv_src}/amdxdna.ko" ko-staging/
          echo "${xdna_modver}" > ko-staging/module_version.txt

      - name: Cache kernel module
        uses: actions/cache/save@v5
        with:
          path: ko-staging/
          key: amdxdna-ko-${{ github.run_id }}-${{ matrix.kernel.slug }}-${{ matrix.mode }}

  # ---------------------------------------------------------------------------
  # Job 5: build-rocm-tools
  # Fetches rocm-smi (ROCm noble repo) + xrt-smi (AMD XRT PPA) + amdsmi Python
  # wheel (PyPI cp312), assembles a single userspace sysext image and .run.
  # Runs on ubuntu-24.04 (noble): ROCm 7.x targets noble (glibc 2.39).
  # TrueNAS SCALE 26.x is Debian trixie (glibc 2.41) — satisfied.
  # No kernel matrix dependency.
  # ---------------------------------------------------------------------------
  build-rocm-tools:
    runs-on: ubuntu-24.04
    name: "rocm-tools"
    outputs:
      rocm_version: ${{ steps.ver.outputs.rocm_version }}
      xrt_version:  ${{ steps.xrt_ver.outputs.xrt_version }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve ROCm version
        id: ver
        run: |
          rocm_version="7.2"
          echo "rocm_version=${rocm_version}" >> "$GITHUB_OUTPUT"
          echo "Building rocm-tools for ROCm ${rocm_version}"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            rsync squashfs-tools tar wget

      - name: Fetch and stage packages
        env:
          ROCM_VERSION: ${{ steps.ver.outputs.rocm_version }}
        working-directory: rocm-tools
        run: bash builder/1_fetch_packages.sh

      - name: Read XRT version
        id: xrt_ver
        run: |
          xrt_ver=$(dpkg-query -W -f='${Version}' libxrt-npu2 2>/dev/null || echo "unknown")
          echo "xrt_version=${xrt_ver}" >> "$GITHUB_OUTPUT"
          echo "XRT version: ${xrt_ver}"

      - name: Assemble sysext image and .run installer
        env:
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_SHA:    ${{ github.sha }}
        working-directory: rocm-tools
        run: bash builder/2_package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: rocm-tools-sysext
          path: rocm-tools/out/*.run
          archive: false
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 6: package
  # Single job (no matrix) — downloads ALL ko artifacts and the firmware
  # artifact, then loops over every kernel×mode combination to assemble sysext
  # images and .run self-extractors. Re-run this job alone after installer or
  # packaging changes without recompiling anything.
  # ---------------------------------------------------------------------------
  package:
    needs: [prepare-matrix, build, build-firmware, build-rocm-tools]
    runs-on: ubuntu-24.04
    name: "package"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync squashfs-tools tar

      - name: Restore firmware from cache
        uses: actions/cache/restore@v5
        with:
          path: amdnpu-firmware
          key: amdxdna-firmware-${{ needs.build-firmware.outputs.fw_commit }}
          fail-on-cache-miss: true

      # The build job saves each .ko dir to cache with key amdxdna-ko-{run_id}-{slug}-{mode}.
      # We restore them here by calling the GHA cache service directly via the
      # ACTIONS_CACHE_URL + ACTIONS_RUNTIME_TOKEN env vars that every runner exposes.
      - name: Restore kernel modules from cache
        env:
          MATRIX: ${{ needs.prepare-matrix.outputs.matrix }}
          RUN_ID: ${{ github.run_id }}
        run: |
          sudo apt-get install -y --no-install-recommends curl jq >/dev/null 2>&1 || true
          echo "${MATRIX}" | jq -r '.[] | (.truenas_tag | gsub("/"; "-"))' | while read -r slug; do
            for mode in production debug; do
              cache_key="amdxdna-ko-${RUN_ID}-${slug}-${mode}"
              dest="amdxdna-ko-${slug}-${mode}"
              echo "Restoring ${cache_key} -> ${dest}/"

              # Query the cache service for an archive URL
              response=$(curl -fsSL \
                -H "Accept: application/json;api-version=6.0-preview.1" \
                -H "Authorization: Bearer ${ACTIONS_RUNTIME_TOKEN}" \
                "${ACTIONS_CACHE_URL}_apis/artifactcache/cache?keys=${cache_key}&version=$(echo -n "${cache_key}" | sha256sum | cut -d' ' -f1)")
              archive_url=$(echo "${response}" | jq -r '.archiveLocation // empty')
              [[ -n "${archive_url}" ]] \
                || { echo "ERROR: cache entry not found for ${cache_key}" >&2; exit 1; }

              mkdir -p "${dest}"
              curl -fsSL "${archive_url}" \
                | tar -xz -C "${dest}" --strip-components=1
              echo "  -> restored: $(ls ${dest})"
            done
          done

      - name: Assemble all sysext images and .run installer
        env:
          MATRIX: ${{ needs.prepare-matrix.outputs.matrix }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_SHA: ${{ github.sha }}
          AMDXDNA_VERSION: ${{ needs.build.outputs.xdna_version }}
        run: bash builder/3_package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: amdxdna-sysext
          path: out/*.run
          archive: false
          retention-days: 30

      - name: Download rocm-tools artifact
        uses: actions/download-artifact@v8
        with:
          name: rocm-tools-sysext
          path: out/

      - name: Read xdna version
        id: ver
        run: echo "xdna_ver=$(cat out/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if gh release view "v${{ steps.ver.outputs.xdna_ver }}" \
              --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.ver.outputs.xdna_ver }} already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.check-release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.xdna_ver }}
          name: amdxdna ${{ steps.ver.outputs.xdna_ver }}
          body: |
            AMD XDNA kernel module + ROCm/XRT userspace tools sysext for TrueNAS SCALE.

            Built from [amd/xdna-driver](https://github.com/amd/xdna-driver) version ${{ steps.ver.outputs.xdna_ver }}.
            ROCm ${{ needs.build-rocm-tools.outputs.rocm_version }}, XRT ${{ needs.build-rocm-tools.outputs.xrt_version }}.

            ## Install XDNA kernel module
            ```bash
            bash amdxdna-override-${{ steps.ver.outputs.xdna_ver }}.run
            ```
            Auto-detects the running kernel and selects the correct module variant.

            ## Install ROCm/XRT userspace tools
            ```bash
            bash rocm-tools-${{ needs.build-rocm-tools.outputs.rocm_version }}.run
            ```
            Provides `/usr/bin/rocm-smi` and `/usr/bin/xrt-smi` via `systemd-sysext`.
          files: out/*.run
